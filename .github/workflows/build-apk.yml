{"name": "Build Android APK", "on": {"workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "timeout-minutes": 40, "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "android-actions/setup-android@v3"},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}},
{"name": "Create Android project", "run": "bash apk-setup.sh"},
{"name": "Build APK", "run": "gradle -p apk assembleDebug --no-daemon --stacktrace"},
{"name": "Collect APK", "run": "cp apk/app/build/outputs/apk/debug/app-debug.apk PSX-Dividends.apk"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "PSX-Dividends-apk", "path": "PSX-Dividends.apk"}},
{"name": "Publish download link", "env": {"GH_TOKEN": "${{ github.token }}"}, "run": "gh release delete apk-latest --cleanup-tag --yes || true\ngh release create apk-latest PSX-Dividends.apk --target \"$GITHUB_SHA\" --title \"PSX Dividends app (Android APK)\" --notes \"Download PSX-Dividends.apk and install it on your Android phone.\""}]}}}
